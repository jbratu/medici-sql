name: CI
on: [push, pull_request]
jobs:
  test:
    name: Node ${{ matrix.node }}, on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js v${{ matrix.node }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}

      # The Prisma client is generated by the prebuild:node lifecycle
      # script inside `npm run ci` (build + test).
      - run: npm ci
      - run: npm run ci

      # G8 (QA amendment, ITD-94 item 2): the published-artifact gate —
      # npm pack, install the tarball with no mongoose present, run the
      # client-facing smoke against build/index.js, tsc a consumer against
      # types/index.d.ts, and assert no "mongoose" specifier survives.
      - name: Packaging smoke (G8)
        run: npm run smoke:packaged
