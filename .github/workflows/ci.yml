name: CI
on: [push, pull_request]
jobs:
  test:
    name: Node ${{ matrix.node }}, on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js v${{ matrix.node }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}

      # The Prisma client is generated by the prebuild:node lifecycle
      # script inside `npm run ci` (build + test).
      - run: npm ci
      - run: npm run ci
