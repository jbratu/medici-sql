name: CI

# Port CI for the SQL (Prisma/SQLite) port. No MongoDB service container and no
# mongoose matrix — the port never talks to Mongo. The build/test job activates
# once the Prisma scaffold lands (prisma/schema.prisma, [ITD-90]); until then
# it reports "skipping" instead of failing on dead config.

on:
  push:
    branches: [master, feature/api-compatible-sql]
  pull_request:
    branches: [feature/api-compatible-sql]
  workflow_dispatch: {}

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Scaffold check
        id: scaffold
        run: |
          if [ -f prisma/schema.prisma ]; then
            echo "scaffold=true" >> "$GITHUB_OUTPUT"
          else
            echo "scaffold=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.scaffold.outputs.scaffold == 'true'
        run: npm ci
      - name: Build + test
        if: steps.scaffold.outputs.scaffold == 'true'
        run: |
          # Standard script names assumed to land with the scaffold (ITD-90/91).
          npm run build
          npm test
      - name: Skip (scaffold not landed yet)
        if: steps.scaffold.outputs.scaffold == 'false'
        run: echo "Prisma scaffold (ITD-90) not landed yet — nothing to build or test."
