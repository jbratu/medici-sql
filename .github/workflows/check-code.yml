name: "Check code"

on:
  pull_request:
    branches: [master, feature/api-compatible-sql]

jobs:
  check-code:
    name: Check Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run lint + prettier
        run: |
          # The port's lint/prettier scripts land with the scaffold; guard so
          # the workflow is not dead config in the meantime.
          if node -e "const s=require('./package.json').scripts||{};process.exit(s.lint&&s.prettier?0:1)"; then
            npm run lint
            npm run prettier
          else
            echo "lint/prettier scripts not defined yet — skipping"
          fi
